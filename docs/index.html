<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MacroWatch</title>
<script>
(function () {
  var BASE = 'https://cdn.jsdelivr.net/gh/Hossein7935/Hossein7935.github.io@main';
  // Alle relativen Netzwerk-Aufrufe (data.json, scripts) auf CDN umbiegen
  var origFetch = window.fetch;
  window.fetch = function (input, init) {
    try {
      var url = typeof input === 'string' ? input : (input && input.url);
      if (typeof url === 'string' && !/^https?:\/\//i.test(url) && !url.startsWith('data:') && !url.startsWith('blob:')) {
        var path = url.replace(/^\.\//, '').replace(/^\//, '');
        var abs = BASE + '/' + path;
        if (typeof input === 'string') input = abs;
        else if (input && typeof Request !== 'undefined') input = new Request(abs, input);
      }
    } catch (e) {}
    return origFetch.call(this, input, init);
  };
  var origOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url) {
    try {
      if (typeof url === 'string' && !/^https?:\/\//i.test(url) && !url.startsWith('data:')) {
        url = BASE + '/' + url.replace(/^\.\//, '').replace(/^\//, '');
      }
    } catch (e) {}
    return origOpen.apply(this, [method, url].concat([].slice.call(arguments, 2)));
  };
  window.__MACROWATCH_CDN_BASE = BASE;
})();
</script>
</head>
<body>
<p id="mw-boot" style="font-family:system-ui;padding:2rem">MacroWatch wird geladen…</p>
<script>
(async function () {
  var BASE = window.__MACROWATCH_CDN_BASE;
  try {
    var html = await (await fetch(BASE + '/index.html?v=' + Date.now())).text();
    if (!html || html.length < 5000) throw new Error('index.html unvollständig');
    // Asset-URLs auf CDN
    html = html.replace(/(src|href)=["'](?!https?:|\/\/|data:|#|mailto:)([^"']+)["']/gi, function (_, attr, url) {
      return attr + '="' + BASE + '/' + String(url).replace(/^\.\//, '').replace(/^\//, '') + '"';
    });
    // data.json in Inline-Scripten absichern
    html = html.replace(/(['"])data\.json\1/g, '"' + BASE + '/data.json"');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    var el = document.getElementById('mw-boot');
    if (el) {
      el.innerHTML =
        'Ladefehler: ' +
        (e && e.message ? e.message : e) +
        '<br><a href="https://github.com/Hossein7935/Hossein7935.github.io">GitHub</a>';
    }
  }
})();
</script>
</body>
</html>
