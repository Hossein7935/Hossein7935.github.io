<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.json"><title>MacroWatch v10</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('macrowatch-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script><style>
:root{color-scheme:dark;--bg:#0b1120;--page-top:#101827;--panel:#141e30;--line:#29364c;--text:#edf3ff;--muted:#aab7cc;--accent:#74d4c4;--warn:#f5c76b;--bad:#ffb2a8;--control:#202c40;--control-line:#3a4b63;--metric:#0e1727;--metric-line:#26334a;--notice-bg:#292517;--notice-line:#5e5030;--notice-text:#ffe5a3;--link-line:#35564f;--bar-label:#8292aa}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f6fb;--page-top:#e8eef7;--panel:#ffffff;--line:#d5deea;--text:#172337;--muted:#5d6b80;--accent:#087f72;--warn:#8a5b00;--bad:#b42318;--control:#ffffff;--control-line:#c7d2e0;--metric:#f6f8fc;--metric-line:#dce4ef;--notice-bg:#fff7db;--notice-line:#e5cf82;--notice-text:#624b00;--link-line:#9ac9c1;--bar-label:#65758b}
:root[data-theme="light"] body{background:linear-gradient(180deg,var(--page-top),var(--bg) 38%)}
:root[data-theme="light"] .btn.primary{color:#fff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--page-top),var(--bg) 38%);color:var(--text);font:15px system-ui,-apple-system,sans-serif}header{padding:25px 16px 14px;max-width:1200px;margin:auto}h1{font-size:30px;margin:0;letter-spacing:-.7px}h1 span{color:var(--accent)}.sub{color:var(--muted);margin-top:4px}.wrap{max-width:1200px;margin:auto;padding:0 12px 36px}.notice{border:1px solid var(--notice-line);background:var(--notice-bg);color:var(--notice-text);padding:12px;border-radius:12px;line-height:1.45;margin:8px 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn,select{background:var(--control);color:var(--text);border:1px solid var(--control-line);border-radius:10px;padding:10px 12px;font:inherit}.primary{background:var(--accent);color:#09211e;border-color:var(--accent);font-weight:700}.status{font-size:12px;color:var(--muted);margin:8px 2px 14px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.country{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;min-width:0}.ctop{display:flex;align-items:center;gap:10px;margin-bottom:12px}.flag{font-size:28px}.country h2{font-size:18px;margin:0}.code{font-size:12px;color:var(--muted)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:var(--metric);border:1px solid var(--metric-line);border-radius:10px;padding:9px;min-height:94px;min-width:0}.metric.has-chart{min-height:118px}.name{font-size:12px;line-height:1.3;color:var(--muted);min-height:30px}.value{font-size:21px;font-weight:700;margin-top:4px;overflow-wrap:anywhere}.na{font-size:12px;font-weight:500;color:#aab7cc}.date{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.35}.metric button{margin-top:7px;font-size:11px;padding:5px 7px;border-radius:7px}.spark{height:27px;display:flex;align-items:flex-end;gap:3px;margin-top:6px;min-width:0}.barwrap{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}.bar{width:100%;max-width:14px;min-height:2px;border-radius:3px 3px 1px 1px;background:var(--accent);opacity:.88}.bar.neg{background:#ffb2a8}.barlabel{font-size:8px;line-height:1;color:var(--bar-label);white-space:nowrap}.sparkcaption{font-size:9px;color:var(--bar-label);margin-top:2px}.sparkempty{font-size:9px;color:var(--bar-label);margin-top:7px}.yield-chart{width:100%;height:58px;margin-top:6px;display:block}.yield-chart-wrap{margin-top:4px}.yield-chart-caption{font-size:9px;color:var(--bar-label);margin-top:2px;display:flex;justify-content:space-between;gap:4px}.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.links a{color:var(--accent);font-size:11px;text-decoration:none;border:1px solid var(--link-line);border-radius:7px;padding:6px 8px}.footer{border-top:1px solid var(--line);margin-top:22px;padding-top:13px;color:var(--muted);font-size:12px;line-height:1.5}dialog{max-width:420px;width:calc(100% - 24px);border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);padding:18px}dialog::backdrop{background:#0009}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}input{width:100%;padding:10px;border:1px solid var(--control-line);border-radius:8px;background:var(--metric);color:var(--text);font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.err{color:var(--bad)}@media(min-width:760px){header{padding-top:34px}}
</style></head><body>
<header><h1>Macro<span>Watch</span></h1><div class="sub">Makro-Dashboard v10 · 6 Länder</div></header>
<main class="wrap">
<div class="notice"><b>Hinweis:</b> Inflation-Chart: 6M/1J/3J wählbar. BIP/Leitzins: ~3 Jahre. 2J/10J: ~6 Monate. Alles aktualisiert sich automatisch alle 6 Stunden.</div>
<div class="toolbar"><button class="btn" id="themeToggle" type="button">☀️ Helles Design</button><button class="btn primary" id="refresh">↻ Alle Daten aktualisieren</button><button class="btn" id="notify">🔔 Hinweise</button><select id="inflRange" aria-label="Inflations-Zeitraum"><option value="3y" selected>Inflation · 3 Jahre</option><option value="1y">Inflation · 1 Jahr</option><option value="6m">Inflation · 6 Monate</option></select><select id="year"><option value="2026">BIP-Prognose 2026</option><option value="2027">BIP-Prognose 2027</option><option value="2028">BIP-Prognose 2028</option></select></div>
<div class="status" id="status" role="status">Warte auf data.json …</div><div class="grid" id="grid"></div>
<div class="footer">MacroWatch · Updates alle ~6h · IMF, BIS, FRED, TradingView, Sina, World Bank</div></main>
<dialog id="edit"><form id="editForm"><h3 id="editTitle">Wert bearbeiten</h3><p class="explain" id="editHelp"></p><label for="editValue">Wert in Prozent</label><input id="editValue" type="number" step="0.01" required><label for="editDate">Stand</label><input id="editDate" type="text" required><div class="actions"><button type="button" class="btn" id="cancel">Abbrechen</button><button type="submit" class="btn primary">Speichern</button></div></form></dialog>
<script>
const countries=[
{id:'CHN',name:'China',flag:'🇨🇳',links:{inflation:'https://www.imf.org/',rate:'https://www.pbc.gov.cn/en/',bonds:'https://www.chinabond.com.cn/',gdp:'https://www.imf.org/external/datamapper/NGDP_RPCH@WEO/CHN'}},
{id:'USA',name:'USA',flag:'🇺🇸',links:{inflation:'https://fred.stlouisfed.org/series/CPIAUCSL',rate:'https://www.federalreserve.gov/',bonds:'https://home.treasury.gov/',gdp:'https://fred.stlouisfed.org/series/A191RL1Q225SBEA'}},
{id:'JPN',name:'Japan',flag:'🇯🇵',links:{inflation:'https://www.imf.org/',rate:'https://www.boj.or.jp/en/',bonds:'https://www.mof.go.jp/english/',gdp:'https://www.imf.org/external/datamapper/NGDP_RPCH@WEO/JPN'}},
{id:'FRA',name:'Frankreich',flag:'🇫🇷',links:{inflation:'https://www.imf.org/',rate:'https://www.ecb.europa.eu/',bonds:'https://data.ecb.europa.eu/',gdp:'https://www.imf.org/external/datamapper/NGDP_RPCH@WEO/FRA'}},
{id:'DEU',name:'Deutschland',flag:'🇩🇪',links:{inflation:'https://www.imf.org/',rate:'https://www.ecb.europa.eu/',bonds:'https://www.bundesbank.de/en/',gdp:'https://www.imf.org/external/datamapper/NGDP_RPCH@WEO/DEU'}},
{id:'AUS',name:'Australien',flag:'🇦🇺',links:{inflation:'https://www.imf.org/',rate:'https://www.rba.gov.au/',bonds:'https://www.rba.gov.au/statistics/interest-rates/',gdp:'https://www.imf.org/external/datamapper/NGDP_RPCH@WEO/AUS'}}];
const defs=[['inflation','Inflation','FRED CPI YoY · Chart-Zeitraum wählbar'],['rate','Leitzins','BIS · 3-Jahres-Chart'],['y2','Staatsanleihen · 2 Jahre','TradingView + 6-Monats-Chart'],['y10','Staatsanleihen · 10 Jahre','TradingView + 6-Monats-Chart'],['tips5','TIPS Realzins · 5 Jahre','FRED DFII5 (USA)'],['tips10','TIPS Realzins · 10 Jahre','FRED DFII10 (USA)'],['gdp','Reales BIP-Wachstum','IMF Jahresprognose + 3-Jahres-Chart']];
const STORE='macrowatch-v10-data', HIST='macrowatch-v10-history', PREV='macrowatch-v10-lastseen';
let data=readStore(STORE), histories=readStore(HIST), previous=readStore(PREV), editTarget=null;
function readStore(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return {}}}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(data));localStorage.setItem(HIST,JSON.stringify(histories));localStorage.setItem(PREV,JSON.stringify(previous))}catch(e){}}
function fmt(v){return Number(v).toLocaleString('de-DE',{maximumFractionDigits:2})+' %'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function valueFor(id,key){return data[id]?.[key]||null}
function historyHTML(country,key){let arr=histories[country+'-'+key]||[];if(key==='inflation'){const range=(document.querySelector('#inflRange')||{}).value||'3y';const now=new Date();let months=36;if(range==='1y')months=12;else if(range==='6m')months=6;const cut=new Date(now.getFullYear(),now.getMonth()-months,1);const cutStr=cut.toISOString().slice(0,7);arr=arr.filter(x=>String(x.period)>=cutStr);}if(!arr.length)return '<div class="sparkempty">Verlauf nicht verfügbar</div>';const pts=arr.map(x=>({period:String(x.period),value:Number(x.value)})).filter(x=>Number.isFinite(x.value));if(!pts.length)return '<div class="sparkempty">Keine gültigen Werte</div>';if(key==='y2'||key==='y10'||key==='rate'||key==='inflation'||key==='gdp'){const vals=pts.map(p=>p.value);let min=Math.min(...vals),max=Math.max(...vals);const pad=(max-min)*0.15||0.08;min-=pad;max+=pad;const w=220,h=58,l=3,r=3,t=4,b=4,iw=w-l-r,ih=h-t-b,n=pts.length;const xy=pts.map((p,i)=>{const x=l+(n===1?iw/2:(i/(n-1))*iw);const y=t+ih-((p.value-min)/(max-min||1))*ih;return[x,y,p]});const line=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');const area=line+' L'+xy.at(-1)[0].toFixed(1)+','+(t+ih)+' L'+xy[0][0].toFixed(1)+','+(t+ih)+' Z';const last=pts.at(-1),first=pts[0],up=last.value>=first.value;const stroke=up?'var(--accent)':'#ffb2a8';const fill=up?'rgba(116,212,196,.22)':'rgba(255,178,168,.18)';return `<div class="yield-chart-wrap"><svg class="yield-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Verlaufs-Chart"><path d="${area}" fill="${fill}"/><path d="${line}" fill="none" stroke="${stroke}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${xy.at(-1)[0].toFixed(1)}" cy="${xy.at(-1)[1].toFixed(1)}" r="2.8" fill="${stroke}"/></svg><div class="yield-chart-caption"><span>${esc(String(first.period).slice(0,7))}</span><span>${fmt(last.value)}</span><span>${esc(String(last.period).slice(0,7))}</span></div></div>`;}let min=Math.min(0,...pts.map(p=>p.value)),max=Math.max(0,...pts.map(p=>p.value));if(max===min)max=min+1;const range=max-min||1;return `<div class="spark">${pts.slice(-5).map(x=>{const v=x.value,hh=Math.max(2,Math.round(((v-min)/range)*22));return `<div class="barwrap" title="${esc(x.period)}: ${fmt(v)}"><div class="bar ${v<0?'neg':''}" style="height:${hh}px"></div><div class="barlabel">${esc(String(x.period).replace(/^\d{4}-Q/,'Q').slice(0,7))}</div></div>`}).join('')}</div><div class="sparkcaption">Letzte ${Math.min(5,pts.length)} Werte</div>`;}
function render(){const grid=document.querySelector('#grid');grid.innerHTML='';for(const c of countries){const card=document.createElement('section');card.className='country';card.innerHTML=`<div class="ctop"><div class="flag">${c.flag}</div><div><h2>${c.name}</h2><div class="code">${c.id}</div></div></div><div class="metrics">${defs.map(([key,label])=>{const m=valueFor(c.id,key);const value=m?fmt(m.value):'Nicht verfügbar';const date=m?`${esc(m.source)} · ${esc(m.date)}`:'Quelle hat keinen Wert geliefert';const spark=key==='inflation'||key==='gdp'||key==='y2'||key==='y10'||key==='rate';return `<div class="metric${(key==='y2'||key==='y10'||key==='rate'||key==='inflation'||key==='gdp')?' has-chart':''}"><div class="name">${label}</div><div class="value ${m?'':'na'}">${value}</div><div class="date">${date}</div>${spark?historyHTML(c.id,key):`<button class="btn" data-edit="${c.id}|${key}">Manuell eintragen</button>`}</div>`}).join('')}</div><div class="links"><a href="${c.links.inflation}" target="_blank" rel="noopener">Inflation ↗</a><a href="${c.links.rate}" target="_blank" rel="noopener">Leitzins ↗</a><a href="${c.links.bonds}" target="_blank" rel="noopener">Anleihen ↗</a><a href="${c.links.gdp}" target="_blank" rel="noopener">IMF-BIP ↗</a></div>`;grid.append(card)}grid.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEdit(b.dataset.edit)))}
function setValue(country,key,value,date,source){if(!Number.isFinite(Number(value)))return;data[country]||(data[country]={});data[country][key]={value:Number(value),date:String(date||''),source};previous[country+'-'+key]=Number(value)}
async function refresh(){const btn=document.querySelector('#refresh'),status=document.querySelector('#status');btn.disabled=true;status.textContent='Lade data.json …';try{const r=await fetch('./data.json?refresh='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('data.json HTTP '+r.status);const payload=await r.json();if(!payload||!payload.data)throw Error('data.json ungültig');for(const c of countries){const incoming=payload.data[c.id]||{};data[c.id]||(data[c.id]={});for(const key of ['inflation','rate','y2','y10','tips5','tips10']){if(incoming[key])data[c.id][key]=incoming[key];else if(data[c.id][key]&&data[c.id][key].source!=='Manuell')delete data[c.id][key];}}if(payload.histories){for(const key of Object.keys(histories)){if(/-(gdp|inflation|y2|y10|rate)$/.test(key))delete histories[key];}histories={...histories,...payload.histories};}const year=String(document.querySelector('#year').value);for(const c of countries){const v=payload.forecasts?.[c.id]?.[year];if(v!=null&&Number.isFinite(Number(v)))setValue(c.id,'gdp',Number(v),'IMF WEO · '+year,'IMF DataMapper · NGDP_RPCH');else if(data[c.id]?.gdp?.source?.includes('IMF'))delete data[c.id].gdp;}persist();render();const counts={inflation:countries.filter(c=>!!data[c.id]?.inflation).length,y2:countries.filter(c=>!!data[c.id]?.y2).length,y10:countries.filter(c=>!!data[c.id]?.y10).length,rate:countries.filter(c=>!!data[c.id]?.rate).length,tips10:countries.filter(c=>!!data[c.id]?.tips10).length};const stamp=payload.updatedAt?new Date(payload.updatedAt).toLocaleString('de-DE'):'?';const e=Array.isArray(payload.errors)?payload.errors:[];status.innerHTML=`Datenstand: ${esc(stamp)}. Inflation ${counts.inflation}/6 · Leitzins ${counts.rate}/6 · 2J ${counts.y2}/6 · 10J ${counts.y10}/6 · TIPS ${counts.tips10}/6.`+(e.length?`<br><span class="err">${e.length} Hinweise</span>`:'');}catch(e){status.innerHTML=`<span class="err">${esc(e.message||e)}</span>`;}finally{btn.disabled=false;}}
function openEdit(token){const[country,key]=token.split('|');editTarget={country,key};const c=countries.find(x=>x.id===country),d=defs.find(x=>x[0]===key),old=valueFor(country,key);document.querySelector('#editTitle').textContent=c.name+': '+d[1];document.querySelector('#editHelp').textContent=d[2];document.querySelector('#editValue').value=old?.value??'';document.querySelector('#editDate').value=old?.date??new Date().toLocaleDateString('de-DE');document.querySelector('#edit').showModal()}
document.querySelector('#editForm').addEventListener('submit',e=>{e.preventDefault();if(!editTarget)return;const v=Number(document.querySelector('#editValue').value),date=document.querySelector('#editDate').value.trim();if(!Number.isFinite(v)||!date)return;setValue(editTarget.country,editTarget.key,v,date,'Manuell');persist();document.querySelector('#edit').close();render()});
document.querySelector('#cancel').addEventListener('click',()=>document.querySelector('#edit').close());
document.querySelector('#refresh').addEventListener('click',refresh);
document.querySelector('#themeToggle').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=next;try{localStorage.setItem('macrowatch-theme',next)}catch{}document.querySelector('#themeToggle').textContent=next==='light'?'🌙 Dunkles Design':'☀️ Helles Design'});
document.querySelector('#notify').addEventListener('click',async()=>{if('Notification'in window)await Notification.requestPermission()});
document.querySelector('#year').addEventListener('change',refresh);
document.querySelector('#inflRange')?.addEventListener('change',()=>render());
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
refresh();
</script></body></html>
