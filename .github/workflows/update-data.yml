name: MacroWatch data update
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main, master]
    paths-ignore:
      - 'data.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: macrowatch-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch updater if broken
        run: |
          set -e
          if ! grep -q 'async function loadInflation' scripts/update-data.mjs 2>/dev/null; then
            echo "Restoring update-data.mjs from known good commit"
            git show c8234d974ef2cf0248b0edd8a81744c2cd03227e:scripts/update-data.mjs > scripts/update-data.mjs
          fi
          sed -i 's/ageDays > 200/ageDays > 280/g' scripts/update-data.mjs
          sed -i 's/ageDays > 45/ageDays > 75/g' scripts/update-data.mjs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check updater syntax
        run: |
          node --check scripts/update-data.mjs
          node --check scripts/fetch-inflation.mjs
          node --check scripts/fetch-y2.mjs
          node --check scripts/fetch-y10.mjs
      - name: Fetch official economic data
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
        run: node scripts/update-data.mjs
      - name: Fill inflation (IMF PCPIPCH / World Bank)
        run: node scripts/fetch-inflation.mjs
      - name: Fill 2Y yields (TradingView TVC:*02Y)
        run: node scripts/fetch-y2.mjs
      - name: Fill 10Y yields (TradingView TVC:*10Y)
        run: node scripts/fetch-y10.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json scripts/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update MacroWatch data"
            git pull --rebase origin main || true
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
