name: MacroWatch data update
on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
  push:
    branches: [main, master]
    paths-ignore:
      - 'data.json'
permissions:
  contents: write
concurrency:
  group: macrowatch-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch updater if broken
        run: |
          set -e
          if ! grep -q 'async function loadInflation' scripts/update-data.mjs 2>/dev/null; then
            git show c8234d974ef2cf0248b0edd8a81744c2cd03227e:scripts/update-data.mjs > scripts/update-data.mjs
          fi
          sed -i 's/ageDays > 200/ageDays > 280/g' scripts/update-data.mjs
          sed -i 's/ageDays > 45/ageDays > 75/g' scripts/update-data.mjs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install poppler (pdftotext) for FHLB OF PDFs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Restore index.html + debt UI
        run: node scripts/restore-index.mjs
      - name: Inject Copper/Gold native chart (USA page 2)
        run: node scripts/inject-cuau.mjs
      - name: Inject DXY (USA page 1)
        run: node scripts/inject-dxy.mjs
      - name: Inject USA page 3 (EFFR/SOFR/IORB + diff)
        run: node scripts/inject-faceC.mjs
      - name: Inject rate overlay (EFFR/SOFR/IORB dual)
        run: node scripts/inject-rate-overlay.mjs
      - name: Fix JS structure after injects
        run: node scripts/fix-js-structure.mjs
      - name: Inject UST + TIPS curve (USA page 4)
        run: node scripts/inject-ust-curve.mjs
      - name: Inject SOFR tenor history picker (USA page 4)
        run: node scripts/inject-sofr-tenor.mjs
      - name: Chart dialog crosshair / axis interact
        run: node scripts/inject-chart-interact.mjs
      - name: Inject FHLBank Advances Monitor (USA page 5)
        run: node scripts/inject-fhlb.mjs
      - name: Inject Fed Funds Volume Monitor (USA page 5)
        run: node scripts/inject-effrvol.mjs
      - name: Fix USA page 5 visibility (faceE)
        run: node scripts/inject-fix-page5.mjs
      - name: Strip extra EFFRVOL charts (keep volume only)
        run: node scripts/strip-effrvol-extra.mjs
      - name: Inject USA page 6 IORB + US 1Y
        run: node scripts/inject-page6-iorb-us1y.mjs
      - name: Inject MOVE Index (USA page 6)
        run: node scripts/inject-move.mjs
      - name: Inject US 2Y + SOFR (USA page 3)
        run: node scripts/inject-us2y-sofr.mjs
      - name: US2Y dual toggle SOFR/IORB
        run: node scripts/inject-us2y-pair-toggle.mjs
      - name: Enable range on rate-diff chart
        run: node scripts/fix-diff-range.mjs
      - name: Enable range on US2Y+SOFR dual chart
        run: node scripts/fix-us2y-sofr-range.mjs
      - name: Fix JS syntax (orphan branches)
        run: node scripts/fix-js-syntax.mjs
      - name: Restore paintChartDlg (enlarged charts)
        run: node scripts/fix-paint-chart-dlg.mjs
      - name: Inject USA page 7 yields + diff
        run: node scripts/inject-page7-yields.mjs
      - name: Fix USA page navigation (sticky)
        run: node scripts/inject-fix-usa-nav.mjs
      - name: Final JS dedupe (after all injects)
        run: node scripts/fix-js-syntax.mjs
      - name: Restore paintChartDlg after final dedupe
        run: node scripts/fix-paint-chart-dlg.mjs
      - name: Re-apply rate overlay after other injects
        run: node scripts/inject-rate-overlay.mjs
      - name: Re-apply DXY panel
        run: node scripts/inject-dxy.mjs
      - name: Re-apply SOFR tenor panel
        run: node scripts/inject-sofr-tenor.mjs
      - name: Check updater syntax
        run: |
          node --check scripts/inject-page7-yields.mjs
          node --check scripts/inject-rate-overlay.mjs
          node --check scripts/inject-dxy.mjs
          node --check scripts/inject-sofr-tenor.mjs
          node --check scripts/fetch-dxy.mjs
          node --check scripts/fetch-sofr-futures.mjs
          node --check scripts/fix-paint-chart-dlg.mjs
          node --check scripts/fix-js-syntax.mjs
      - name: Fetch official economic data
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
        run: node scripts/update-data.mjs
      - name: Fill inflation
        run: node scripts/fetch-inflation.mjs
      - name: Fill 2Y yields
        run: node scripts/fetch-y2.mjs
      - name: Fill 10Y yields
        run: node scripts/fetch-y10.mjs
      - name: Country 10Y−2Y spreads (DEU FRA JPN AUS CHN)
        run: node scripts/fetch-country-t10y2y.mjs
      - name: Fill US TIPS
        run: node scripts/fetch-tips.mjs
      - name: Build 6-month yield charts (2Y/10Y)
        run: node scripts/fetch-yield-charts.mjs
      - name: CME Term SOFR 3M + T10Y2Y (free)
        run: node scripts/fetch-sofr-term.mjs
      - name: SOFR − US 3M spread (TradingView)
        run: node scripts/fetch-sofr-muni-spread.mjs
      - name: BofA CCC High Yield (FRED / TradingView)
        run: node scripts/fetch-bofa-ccc.mjs
      - name: US10Y − TIPS10Y spread (FRED T10YIE)
        run: node scripts/fetch-us10y-tips-spread.mjs
      - name: US5Y − TIPS5Y spread (FRED T5YIE)
        run: node scripts/fetch-us5y-tips-spread.mjs
      - name: US10Y − US5Y spread (FRED DGS10−DGS5)
        run: node scripts/fetch-us10y5y.mjs
      - name: SOFR − IORB spread (FRED)
        run: node scripts/fetch-sofr-iorb.mjs
      - name: WRESBAL bank reserves (FRED)
        run: node scripts/fetch-wresbal.mjs
      - name: EFFR + SOFR + IORB daily (USA page 3)
        run: node scripts/fetch-effr-sofr-iorb.mjs
      - name: SOFR forward curve (SR1 + NY Fed, Seite 4)
        run: node scripts/fetch-sofr-futures.mjs
      - name: US Treasury + TIPS curve (Seite 4)
        run: node scripts/fetch-ust-curve.mjs
      - name: FHLBank Advances (Office of Finance PDFs)
        run: node scripts/fetch-fhlb-advances.mjs
      - name: Federal Funds Market Volume (FRED EFFRVOL)
        run: node scripts/fetch-effr-volume.mjs
      - name: IORB + US 1Y (FRED)
        run: node scripts/fetch-iorb-us1y.mjs
      - name: MOVE Index (Yahoo ^MOVE)
        run: node scripts/fetch-move.mjs
      - name: DXY US Dollar Index (Yahoo)
        run: node scripts/fetch-dxy.mjs
      - name: US 2Y + SOFR dual (FRED)
        run: node scripts/fetch-us2y-sofr.mjs
      - name: USA page 7 UST + TIPS daily (FRED)
        run: node scripts/fetch-ust-tips-page7.mjs
      - name: HH + Business debt growth (Fed Z.1)
        run: node scripts/fetch-nonfin-debt.mjs
      - name: Copper/Gold ratio (Yahoo HG=F / GC=F)
        run: node scripts/fetch-cu-au.mjs
      - name: Build 3-year policy rate charts
        run: node scripts/fetch-rate-charts.mjs
      - name: Build inflation charts (3y)
        run: node scripts/fetch-inflation-charts.mjs
      - name: Build 3-year GDP growth charts
        run: node scripts/fetch-gdp-charts.mjs
      - name: US bank reserves relative to GDP
        run: node scripts/fetch-reserves-gdp.mjs
      - name: Fiscal deficit (IMF)
        run: node scripts/fetch-deficit.mjs
      - name: Commit updated data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/fix-js-syntax.mjs || true
          node scripts/inject-fix-usa-nav.mjs || true
          node scripts/inject-rate-overlay.mjs || true
          node scripts/inject-dxy.mjs || true
          node scripts/inject-sofr-tenor.mjs || true
          node scripts/fix-js-syntax.mjs || true
          node scripts/fix-paint-chart-dlg.mjs || true
          node scripts/inject-sofr-tenor.mjs || true
          git add data.json scripts/ index.html || true
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update MacroWatch data + fixed index JS" || true
            git pull --no-rebase -X ours origin main || true
            node scripts/fix-js-syntax.mjs || true
            node scripts/fix-paint-chart-dlg.mjs || true
            node scripts/inject-sofr-tenor.mjs || true
            git add data.json scripts/ index.html || true
            git commit -m "Merge data update" || true
            git push origin HEAD:main || git push --force-with-lease origin HEAD:main
          fi
