name: MacroWatch data update
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main, master]
    paths-ignore:
      - 'data.json'
permissions:
  contents: write
concurrency:
  group: macrowatch-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch updater if broken
        run: |
          set -e
          if ! grep -q 'async function loadInflation' scripts/update-data.mjs 2>/dev/null; then
            git show c8234d974ef2cf0248b0edd8a81744c2cd03227e:scripts/update-data.mjs > scripts/update-data.mjs
          fi
          sed -i 's/ageDays > 200/ageDays > 280/g' scripts/update-data.mjs
          sed -i 's/ageDays > 45/ageDays > 75/g' scripts/update-data.mjs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore index.html + debt UI
        run: node scripts/restore-index.mjs
      - name: Check updater syntax
        run: |
          node --check scripts/fetch-nonfin-debt.mjs
          node --check scripts/fetch-sofr-muni-spread.mjs
          node --check scripts/fetch-bofa-ccc.mjs
          node --check scripts/fetch-us10y-tips-spread.mjs
          node --check scripts/restore-index.mjs
      - name: Fetch official economic data
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
        run: node scripts/update-data.mjs
      - name: Fill inflation
        run: node scripts/fetch-inflation.mjs
      - name: Fill 2Y yields
        run: node scripts/fetch-y2.mjs
      - name: Fill 10Y yields
        run: node scripts/fetch-y10.mjs
      - name: Fill US TIPS
        run: node scripts/fetch-tips.mjs
      - name: Build 6-month yield charts (2Y/10Y)
        run: node scripts/fetch-yield-charts.mjs
      - name: CME Term SOFR 3M + T10Y2Y (free)
        run: node scripts/fetch-sofr-term.mjs
      - name: SOFR − US 3M spread (TradingView)
        run: node scripts/fetch-sofr-muni-spread.mjs
      - name: BofA CCC High Yield (FRED / TradingView)
        run: node scripts/fetch-bofa-ccc.mjs
      - name: US10Y − TIPS10Y spread (FRED T10YIE)
        run: node scripts/fetch-us10y-tips-spread.mjs
      - name: HH + Business debt growth (Fed Z.1)
        run: node scripts/fetch-nonfin-debt.mjs
      - name: Build 3-year policy rate charts
        run: node scripts/fetch-rate-charts.mjs
      - name: Build inflation charts (3y)
        run: node scripts/fetch-inflation-charts.mjs
      - name: Build 3-year GDP growth charts
        run: node scripts/fetch-gdp-charts.mjs
      - name: US bank reserves relative to GDP
        run: node scripts/fetch-reserves-gdp.mjs
      - name: Fiscal deficit (IMF)
        run: node scripts/fetch-deficit.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json scripts/ index.html || true
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update MacroWatch data" || true
            git pull --no-rebase -X ours origin main || true
            git add data.json scripts/ index.html || true
            git commit -m "Merge data update" || true
            git push origin HEAD:main || git push --force-with-lease origin HEAD:main
          fi
