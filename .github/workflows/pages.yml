name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync full site into docs/
        run: |
          set -e
          mkdir -p docs
          # komplette statische Seite nach docs (Pages-Source /docs)
          for f in index.html data.json version.json freshness.json manifest.json robots.txt; do
            [ -f "$f" ] && cp -f "$f" "docs/$f" && echo "copied $f"
          done
          for f in *.js; do
            [ -f "$f" ] && cp -f "$f" "docs/$f"
          done
          touch docs/.nojekyll
          echo "docs sizes:"
          wc -c docs/index.html docs/data.json docs/eur-dollar.js 2>/dev/null || true
          ls -la docs | head -40
      - name: Commit docs snapshot (for branch/docs publishing)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "docs unchanged"
          else
            git commit -m "Sync docs/ static site for GitHub Pages" || true
            git push origin HEAD:main || true
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
