name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync site into docs/ (branch/docs Pages source)
        run: |
          set -e
          mkdir -p docs
          for f in index.html data.json version.json freshness.json manifest.json robots.txt sw.js \
                   eur-dollar.js credit.js autorefresh.js; do
            if [ -f "$f" ]; then cp -f "$f" "docs/$f"; fi
          done
          for f in *.js; do
            [ -f "$f" ] && cp -f "$f" "docs/$f" || true
          done
          touch docs/.nojekyll
          wc -c docs/index.html docs/data.json 2>/dev/null || true
          ls -la docs | head -30
      - name: Neuesten Datenstand übernehmen
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node scripts/sync-live-data.mjs || true
          node scripts/finalize-data.mjs || true
          node scripts/inject-autorefresh.mjs || true
          for f in index.html data.json version.json freshness.json eur-dollar.js credit.js autorefresh.js; do
            [ -f "$f" ] && cp -f "$f" "docs/$f" || true
          done
          touch docs/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
