name: Fix eur-dollar enlarge
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore and patch eur-dollar
        run: |
          node scripts/restore-eur-dollar.mjs || true
          node scripts/patch-fix-curve-open.mjs || true
          node scripts/patch-curve-enlarge-click.mjs || true
          node --check eur-dollar.js
          grep -q "openChart('USA', 'usDeCurve'" eur-dollar.js
          wc -c eur-dollar.js
      - name: Commit fixed file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eur-dollar.js
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "fix: Renditekurve vergrößern (openChart)"
          git push origin HEAD:main
      - name: Prepare pages files
        run: |
          mkdir -p docs
          cp -f eur-dollar.js docs/eur-dollar.js || true
          cp -f index.html docs/index.html || true
          [ -f data.json ] && cp -f data.json docs/data.json || true
          touch docs/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
  deploy:
    needs: fix
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
